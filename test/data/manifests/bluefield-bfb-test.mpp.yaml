version: '2'
mpp-vars:
  # Real file hashes from /root/generic-rhcos-bluefield/
  kernel_checksum: "sha256:aefac1f427dfae45828371b0e5662a56948129cc59126752bc01ba0f723516ba"
  initramfs_checksum: "sha256:8968d45f49a0411a37d40dc58a9e07356a27ac9469f76a7701167b60a78a0c66"
  rootfs_checksum: "sha256:c8cc118a9661d6c5694c99f89e53a0387b717156b2b422362b985b04bfef87a2"
  output_filename: "rhcos-bluefield-generic.bfb"

  # CoreOS-specific boot args provided by caller (not hardcoded in stage)
  extra_boot_args:
    - "ignition.firstboot"
    - "ignition.platform.id=nvidiabluefield"

sources:
  org.osbuild.curl:
    items:
      sha256:aefac1f427dfae45828371b0e5662a56948129cc59126752bc01ba0f723516ba:
        url: "file:///root/generic-rhcos-bluefield/rhcos-generic_4.21.1-live-kernel.aarch64"
      sha256:8968d45f49a0411a37d40dc58a9e07356a27ac9469f76a7701167b60a78a0c66:
        url: "file:///root/generic-rhcos-bluefield/rhcos-generic_4.21.1-live-initramfs.aarch64.img"
      sha256:c8cc118a9661d6c5694c99f89e53a0387b717156b2b422362b985b04bfef87a2:
        url: "file:///root/generic-rhcos-bluefield/rhcos-generic_4.21.1-live-rootfs.aarch64.img"

pipelines:
  - name: bfb
    stages:
      - type: org.osbuild.bfb
        inputs:
          kernel:
            type: org.osbuild.files
            origin: org.osbuild.source
            references:
              sha256:aefac1f427dfae45828371b0e5662a56948129cc59126752bc01ba0f723516ba: {}
          initramfs:
            type: org.osbuild.files
            origin: org.osbuild.source
            references:
              sha256:8968d45f49a0411a37d40dc58a9e07356a27ac9469f76a7701167b60a78a0c66: {}
          rootfs:
            type: org.osbuild.files
            origin: org.osbuild.source
            references:
              sha256:c8cc118a9661d6c5694c99f89e53a0387b717156b2b422362b985b04bfef87a2: {}
        options:
          filename:
            mpp-format-string: "{output_filename}"
          boot_args_v2:
            mpp-eval: >-
              ["console=hvc0", "console=ttyAMA0", "earlycon=pl011,0x13010000",
               "initrd=initramfs", "modprobe.blacklist=mlxbf_pmc"] + extra_boot_args