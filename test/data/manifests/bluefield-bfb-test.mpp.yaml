version: '2'
mpp-vars:
  # RHCOS 4.20.11 aarch64 live artifacts from the Red Hat mirror.
  # Update these to match your target OpenShift version:
  # https://mirror.openshift.com/pub/openshift-v4/aarch64/dependencies/rhcos/
  # Checksums are published alongside each release in sha256sum.txt.
  kernel_url: "https://mirror.openshift.com/pub/openshift-v4/aarch64/dependencies/rhcos/4.20/latest/rhcos-4.20.11-aarch64-live-kernel.aarch64"
  kernel_sha256: "sha256:b5ea6189785c9b2a5fa7520d9893a7f51418bcd8586c62e65a034bb741b3aa00"
  initramfs_url: "https://mirror.openshift.com/pub/openshift-v4/aarch64/dependencies/rhcos/4.20/latest/rhcos-4.20.11-aarch64-live-initramfs.aarch64.img"
  initramfs_sha256: "sha256:d726cbeb275b7b5f2d5a5177f3866f80acbeb6e3566af7dac1895a625373fcb7"
  rootfs_url: "https://mirror.openshift.com/pub/openshift-v4/aarch64/dependencies/rhcos/4.20/latest/rhcos-4.20.11-aarch64-live-rootfs.aarch64.img"
  rootfs_sha256: "sha256:66078a363d4e76540c4cedc8e4756f67a852c90964e8af5ac4dec8a18995ec5b"

  output_filename: "rhcos-bluefield.bfb"

  # OS-specific boot args appended on top of hardware defaults.
  # Hardware defaults (console, earlycon, initrd, modprobe.blacklist=mlxbf_pmc)
  # are set by the mpp-eval below and come from the stage's default_args_v2.
  # For CoreOS/RHCOS add ignition args here; leave empty [] for other distros.
  os_boot_args: []

sources:
  org.osbuild.curl:
    items:
      mpp-eval: |
        {
          kernel_sha256: {"url": kernel_url},
          initramfs_sha256: {"url": initramfs_url},
          rootfs_sha256: {"url": rootfs_url},
        }

pipelines:
  - name: bfb
    stages:
      - type: org.osbuild.bfb
        inputs:
          kernel:
            type: org.osbuild.files
            origin: org.osbuild.source
            references:
              mpp-eval: "{kernel_sha256: {}}"
          initramfs:
            type: org.osbuild.files
            origin: org.osbuild.source
            references:
              mpp-eval: "{initramfs_sha256: {}}"
          rootfs:
            type: org.osbuild.files
            origin: org.osbuild.source
            references:
              mpp-eval: "{rootfs_sha256: {}}"
        options:
          filename:
            mpp-format-string: "{output_filename}"
          boot_args_v2:
            mpp-eval: >-
              ["console=hvc0", "console=ttyAMA0", "earlycon=pl011,0x13010000",
               "initrd=initramfs", "modprobe.blacklist=mlxbf_pmc"] + os_boot_args
